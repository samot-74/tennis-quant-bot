# Daily send to Telegram: Betano.pt vs Pinnacle (OddsPapi), ~07:00 Lisbon (UTC+0 in winter).
# Summer (UTC+1, end of March): move both crons one hour earlier.
# Secrets (repo Settings > Secrets and variables > Actions): TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
# ODDSPAPI_KEY, BANKROLL_EUR.
name: daily

on:
  schedule:
    # GitHub's cron is best effort and drops runs, worst at :00. Two off-peak tries; the gate
    # below makes the second one a no-op if the first already sent. First matches are 08:00 Lisbon.
    - cron: "53 6 * * *"
    - cron: "23 7 * * *"
  workflow_dispatch:      # "Run workflow" button for a manual send

concurrency: daily        # never two sends at once

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions: { actions: read }
    outputs:
      sent: ${{ steps.c.outputs.sent }}
    steps:
      - id: c
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w daily -s success -e schedule --created "$(date -u +%F)" --json databaseId -q length)
          echo "sent=$n" >> "$GITHUB_OUTPUT"

  send:
    needs: gate
    if: github.event_name != 'schedule' || needs.gate.outputs.sent == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -X utf8 -m pytest -q tests

      # data/ (DuckDB with sent alerts + OddsPapi request counter, TML CSVs) carries over between runs
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Update TennisMyLife history
        run: python -X utf8 -m src.historical_loader

      - name: Compare odds and send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          BANKROLL_EUR: ${{ secrets.BANKROLL_EUR }}
        run: |
          : "${TELEGRAM_BOT_TOKEN:?secret missing}" "${TELEGRAM_CHAT_ID:?secret missing}" "${ODDSPAPI_KEY:?secret missing}" "${BANKROLL_EUR:?secret missing}"
          python -X utf8 -m src.pipeline T2

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: data-${{ github.run_id }}
